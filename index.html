<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feedback verzamelen · Prototypes</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --ink: #1a1d24;
      --muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 2.5rem 1.5rem 2rem;
      text-align: center;
    }
    header h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
    header p { color: var(--muted); max-width: 34rem; margin: 0 auto; line-height: 1.5; }
    main { max-width: 60rem; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr));
      gap: 1.25rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      text-decoration: none;
      color: inherit;
      transition: box-shadow 0.15s ease, transform 0.15s ease;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08); transform: translateY(-2px); }
    .card h2 { font-size: 1.05rem; }
    .card .meta { color: var(--muted); font-size: 0.85rem; }
    .card .cta { color: var(--accent); font-size: 0.9rem; font-weight: 600; margin-top: auto; }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 3rem 1rem;
      border: 1px dashed var(--border);
      border-radius: 0.75rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header>
    <h1>Feedback verzamelen</h1>
    <p>
      Hieronder staan de prototypes die nu live zijn. Open een prototype en
      gebruik de feedbackknop (Usersnap) om je opmerkingen achter te laten.
    </p>
  </header>
  <main>
    <div class="grid">
      <!-- PROTOTYPES-START -->
      <!-- Kaart-template (kopieer, vul in, plaats binnen de markers):
      <a class="card" href="prototypes/SLUG/">
        <h2>TITEL</h2>
        <div class="meta">Live sinds DD-MM-JJJJ</div>
        <div class="cta">Bekijk &amp; geef feedback &rarr;</div>
      </a>
      -->
      <a class="card" href="prototypes/voorbeeld/">
        <h2>Voorbeeldprototype</h2>
        <div class="meta">Testpagina voor de werkwijze</div>
        <div class="cta">Bekijk &amp; geef feedback &rarr;</div>
      </a>
      <!-- PROTOTYPES-END -->
    </div>
  </main>
</body>
</html>
