<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow" />
<title>Mijn account — AdViewer 2.0</title>
<style>
  :root{--blauw:#195AA6;--donker:#1B4B89;--nacht:#172842;--fel:#0B78BE;--licht:#5BC4E8;--grijs:#575756;--bg:#F1F5FA;--lijn:#E3EAF3;--zijbreed:272px}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"Century Gothic",CenturyGothic,Poppins,sans-serif;background:var(--bg);color:var(--grijs);font-size:15px;line-height:1.55;min-height:100vh}
  a{color:var(--fel)}
  /* ------- volledige navigatiebalk links ------- */
  .zij{position:fixed;left:0;top:0;bottom:0;width:var(--zijbreed);background:linear-gradient(180deg,var(--nacht) 0%,var(--donker) 55%,var(--blauw) 130%);color:#fff;display:flex;flex-direction:column;padding:22px 16px;overflow-y:auto;z-index:40}
  .zij .logo{display:block;height:30px;width:auto;align-self:flex-start;margin:2px 10px 12px;filter:brightness(0) invert(1)}
  .zij .merk{font-weight:800;font-size:18px;letter-spacing:.3px;padding:0 10px}
  .auth-logo{display:block;height:34px;width:auto;margin:26px 0 0 30px}
  .zij .merk small{display:block;font-weight:400;font-size:11.5px;opacity:.65;letter-spacing:1.2px;text-transform:uppercase;margin-top:2px}
  .zij .wie{display:flex;gap:11px;align-items:center;background:rgba(255,255,255,.10);border-radius:14px;padding:12px;margin:18px 0 16px}
  .avatar{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--donker);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 42px}
  .zij .wie b{display:block;font-size:14px;line-height:1.25}
  .zij .wie small{font-size:11px;opacity:.75;word-break:break-all}
  .zij .kopje{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;opacity:.55;padding:12px 10px 6px}
  .zij nav{display:flex;flex-direction:column;gap:3px}
  .zij nav button{display:flex;align-items:center;gap:11px;border:none;background:none;width:100%;text-align:left;font-family:inherit;font-size:14px;color:#fff;padding:11px 12px;border-radius:11px;cursor:pointer;font-weight:700}
  .zij nav button svg{flex:0 0 19px;stroke:rgba(255,255,255,.85)}
  .zij nav button:hover{background:rgba(255,255,255,.12)}
  .zij nav button.aan{background:#fff;color:var(--donker)}
  .zij nav button.aan svg{stroke:var(--donker)}
  .zij nav .tel{margin-left:auto;background:rgba(255,255,255,.18);border-radius:999px;font-size:11.5px;font-weight:800;padding:2px 9px}
  .zij nav button.aan .tel{background:#EAF1F9;color:var(--donker)}
  .zij .duw{flex:1}
  .zij .voet{border-top:1px solid rgba(255,255,255,.16);padding-top:10px;margin-top:14px}
  /* ------- hoofd ------- */
  .hoofd{margin-left:var(--zijbreed);padding:26px 34px 60px;max-width:1080px}
  .balk{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
  .balk h1{color:var(--nacht);font-size:25px;font-weight:800}
  .balk p{margin-top:4px;font-size:14px;max-width:620px}
  .balk .viewerknop{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;background:var(--blauw);color:#fff;text-decoration:none;font-weight:700;font-size:13.5px;padding:11px 20px;border-radius:999px;white-space:nowrap}
  .balk .viewerknop:hover{background:var(--donker)}
  .paneel{background:#fff;border:1px solid var(--lijn);border-radius:16px;padding:22px}
  /* ------- uploads ------- */
  .rooster{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
  .kaart{border:1px solid var(--lijn);border-radius:14px;background:#fff;display:flex;flex-direction:column;transition:box-shadow .15s}
  .kaart:hover{box-shadow:0 10px 26px rgba(27,75,137,.13)}
  .kaart .beeld{background:#0f1a2b;height:170px;display:flex;align-items:center;justify-content:center;position:relative;border-radius:14px 14px 0 0}
  .kaart .beeld img{max-width:82%;max-height:150px;object-fit:contain;box-shadow:0 4px 16px rgba(0,0,0,.45);border-radius:3px}
  .badge{position:absolute;top:10px;left:10px;background:var(--licht);color:var(--nacht);font-size:10.5px;font-weight:800;letter-spacing:.6px;border-radius:999px;padding:4px 10px;text-transform:uppercase}
  .kaart .info{padding:12px 15px 4px}
  .kaart .info b{color:var(--nacht);font-size:14px;word-break:break-all;display:block}
  .kaart .info small{color:#8b93a3;font-size:12px}
  .kaart .acties{display:flex;gap:8px;align-items:center;padding:11px 15px 15px}
  .meer{position:relative}
  .meerknop{width:38px;height:38px;padding:0;border-radius:50%;font-size:19px;line-height:1;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid #D8DEE9;background:#fff;color:var(--grijs);cursor:pointer;font-family:inherit}
  .meerknop:hover,.meer.open .meerknop{border-color:var(--blauw);color:var(--blauw);background:#EAF1F9}
  .meer .menu{display:none;position:absolute;right:0;bottom:calc(100% + 8px);background:#fff;border:1px solid var(--lijn);border-radius:12px;box-shadow:0 12px 30px rgba(27,75,137,.20);min-width:210px;padding:6px;z-index:15}
  .meer.open .menu{display:block}
  .meer .menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--nacht);padding:9px 11px;border-radius:8px;cursor:pointer}
  .meer .menu button:hover{background:#F1F6FC}
  .meer .menu button.rood{color:#C0392B}
  .meer .menu button.rood:hover{background:#FDF2F0}
  .k-knop{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--blauw);background:#fff;color:var(--blauw);border-radius:999px;font-size:12.5px;font-weight:700;padding:8px 13px;cursor:pointer;font-family:inherit}
  .k-knop:hover{background:#EAF1F9}
  .k-knop.vol{background:var(--blauw);color:#fff;flex:1}
  .k-knop.vol:hover{background:var(--donker)}
  .k-knop.weg{border-color:#D8DEE9;color:#8b93a3}
  .k-knop.weg:hover{border-color:#C0392B;color:#C0392B;background:#FDF2F0}
  /* ------- vergelijken ------- */
  .kiesrij{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .kiesrij .veld{flex:1;min-width:220px;margin:0}
  .cmp-vlak{background:var(--nacht);border-radius:16px;padding:24px;display:flex;gap:20px}
  .cmp-vlak>div{flex:1;text-align:center;min-width:0}
  .cmp-vlak img{max-width:100%;max-height:400px;object-fit:contain;border-radius:6px;box-shadow:0 8px 26px rgba(0,0,0,.5)}
  .cmp-vlak .cap{color:#fff;font-size:13px;font-weight:700;margin-top:10px;word-break:break-all}
  .cmp-vlak .ab{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--licht);color:var(--nacht);font-weight:800;font-size:13px;align-items:center;justify-content:center;margin-bottom:10px}
  /* AC-01: vergelijken in objectcontext */
  .cmp-scene{position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:12px;background:#1c2733;box-shadow:0 8px 26px rgba(0,0,0,.35)}
  .cmp-scene .foto{position:absolute;inset:0;background-size:cover}
  .cmp-scene .dim{position:absolute;inset:0}
  .cmp-scene .frame{position:absolute;filter:drop-shadow(0 10px 18px rgba(11,13,16,.35))}
  .cmp-scene .frame>img.kader{position:absolute;inset:0;width:100%;height:100%}
  .cmp-scene .vlak{position:absolute;overflow:hidden}
  .cmp-scene .vlak img{width:100%;height:100%;object-fit:cover;display:block}
  .cmp-scene .gloss{position:absolute;inset:0;background:linear-gradient(112deg,rgba(255,255,255,0) 38%,rgba(255,255,255,.2) 45%,rgba(255,255,255,.05) 52%,rgba(255,255,255,0) 58%);box-shadow:inset 0 0 30px rgba(10,16,24,.28);pointer-events:none}
  .cmp-scene .chip{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:5px;background:var(--blauw);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:4px 10px;border-radius:999px}
  /* ------- leegte ------- */
  .leeg{text-align:center;padding:46px 20px}
  .leeg .em{font-size:40px}
  .leeg h3{color:var(--nacht);font-size:18px;margin:10px 0 6px}
  .leeg p{max-width:430px;margin:0 auto 18px;font-size:14px}
  /* ------- formulieren ------- */
  .veldrij{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
  .veld label{display:block;font-size:12.5px;font-weight:700;color:var(--donker);margin-bottom:5px}
  .veld input,.veld select{width:100%;border:1.5px solid #C9D4E4;border-radius:10px;padding:11px 13px;font-size:14.5px;font-family:inherit;color:var(--nacht);background:#fff}
  .veld input:focus,.veld select:focus{outline:2px solid var(--fel);border-color:var(--fel)}
  .breed{grid-column:1/-1}
  .hoofdknop{display:inline-block;border:none;border-radius:999px;background:var(--blauw);color:#fff;font-weight:700;font-size:14.5px;padding:12px 26px;cursor:pointer;font-family:inherit;text-decoration:none}
  .hoofdknop:hover{background:var(--donker)}
  .fout{color:#C0392B;font-size:13px;margin-top:8px;display:none}
  /* ------- tabel ------- */
  table{width:100%;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--donker);font-size:12.5px;letter-spacing:.3px;border-bottom:2px solid var(--lijn);padding:9px 10px}
  td{border-bottom:1px solid var(--lijn);padding:11px 10px;color:var(--nacht);word-break:break-all}
  .tag{background:#E4F5E6;color:#1E7C33;font-size:12px;font-weight:700;border-radius:999px;padding:4px 11px;white-space:nowrap}
  .deelrij{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#F1F6FC;border:1px solid var(--lijn);border-radius:12px;padding:14px;margin-bottom:18px}
  .deelrij .veld{flex:1;min-width:190px;margin:0}
  /* ------- deel de tool ------- */
  .linkvak{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
  .linkvak input{flex:1;min-width:240px;border:1.5px solid #C9D4E4;border-radius:10px;padding:11px 13px;font-size:13.5px;font-family:inherit;color:var(--nacht);background:#F7FAFD}
  .stap{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--lijn)}
  .stap:last-of-type{border-bottom:none}
  .stap .n{flex:0 0 26px;height:26px;border-radius:50%;background:#EAF1F9;color:var(--donker);font-weight:800;font-size:12.5px;display:grid;place-items:center}
  .stap b{color:var(--nacht);font-size:14px;display:block}
  .stap p{font-size:13px}
  /* ------- auth ------- */
  .auth{max-width:500px;margin:30px auto}
  .auth .tabs{display:flex;gap:8px;margin-bottom:16px}
  .auth .tabs button{flex:1;border:1.5px solid var(--blauw);background:#fff;color:var(--blauw);font-weight:700;font-size:14px;padding:11px;border-radius:999px;cursor:pointer;font-family:inherit}
  .auth .tabs button.aan{background:var(--blauw);color:#fff}
  .voordeel{background:#EAF1F9;border:1.5px solid var(--blauw);border-radius:14px;padding:16px 18px;margin-bottom:16px}
  .voordeel h3{color:var(--nacht);font-size:15.5px;margin-bottom:8px}
  .voordeel div{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;margin:5px 0}
  .statrij{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--lijn);border-radius:16px;padding:20px;text-align:left;cursor:pointer;font-family:inherit;transition:box-shadow .15s}
  .stat:hover{box-shadow:0 10px 26px rgba(27,75,137,.13)}
  .stat .getal{display:block;font-size:34px;font-weight:800;color:var(--blauw);line-height:1.1}
  .stat .label{display:block;font-size:13.5px;color:var(--grijs);margin:2px 0 10px}
  .stat .actie{font-size:12.5px;font-weight:700;color:var(--fel)}
  .recent{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
  .recent-item{border:1px solid var(--lijn);border-radius:12px;background:#0f1a2b;padding:8px;cursor:pointer;font-family:inherit;width:110px}
  .recent-item img{width:100%;height:110px;object-fit:contain}
  .recent-item span{display:block;font-size:10.5px;color:#cfd6e0;margin-top:6px;word-break:break-all}
  .aanvraag{margin-bottom:14px}
  .a-kop{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .a-kop b{color:var(--nacht);font-size:15px}
  .a-regel{display:flex;gap:10px;font-size:13.5px;color:var(--nacht);padding:5px 0;border-top:1px solid var(--lijn)}
  .a-regel span{flex:0 0 84px;color:#8b93a3;font-size:12.5px;font-weight:700;padding-top:1px}
  .tag.wacht{background:#FDF3E0;color:#9A6A00}
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--nacht);color:#fff;padding:11px 22px;border-radius:999px;font-size:14px;z-index:60;box-shadow:0 8px 22px rgba(0,0,0,.3)}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--fel);outline-offset:2px}
  @media(max-width:900px){
    .zij{position:static;width:100%;height:auto;padding:16px}
    .hoofd{margin-left:0;padding:20px}
    .cmp-vlak{flex-direction:column}
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
(function () {
  var LSK = 'adviewer2_account_v1', REOPEN = 'adviewer2_reopen_v1';
  function load() { try { var d = JSON.parse(localStorage.getItem(LSK)); if (d && d.uploads) { if (!d.requests) d.requests = []; return d; } } catch (e) {} return { user: null, loggedIn: false, uploads: [], requests: [] }; }
  var db = load();
  function save() { try { localStorage.setItem(LSK, JSON.stringify(db)); } catch (e) {} }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function initialen() { var p = (db.user.naam || db.user.email || '?').trim().split(/\s+/); return ((p[0] || '')[0] || '?').toUpperCase() + (p.length > 1 ? (p[p.length - 1][0] || '').toUpperCase() : ''); }
  function datumNL(iso) { try { return new Date(iso).toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return ''; } }
  var viewerUrl = new URL('..', location.href).href;
  function toast(msg) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600); }
  function kopieer(txt, melding) {
    function done() { toast(melding); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function () { window.prompt('Kopieer deze link:', txt); });
    else window.prompt('Kopieer deze link:', txt);
  }
  var app = document.getElementById('app');
  var VINK = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#195AA6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 17px;margin-top:2px"><path d="M20 6L9 17l-5-5"/></svg>';
  function icoon(d) { return '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>'; }
  var ICO = {
    overzicht: icoon('<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>'),
    aanvragen: icoon('<path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.6 8.6 0 01-3.9-.9L3 20l1-4.9a8.4 8.4 0 015-11.7 8.4 8.4 0 0112 8.1z"/>'),
    uploads: icoon('<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>'),
    vergelijk: icoon('<rect x="2" y="5" width="9" height="14" rx="1.5"/><rect x="13" y="5" width="9" height="14" rx="1.5"/>'),
    gedeeld: icoon('<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>'),
    profiel: icoon('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/>'),
    deel: icoon('<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>'),
    viewer: icoon('<path d="M15 18l-6-6 6-6"/>'),
    uit: icoon('<path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>')
  };

  /* ---------- dummy-data: zes voorbeelduitingen ---------- */
  function maakBeeld(t1, t2, k1, k2) {
    var c = document.createElement('canvas'); c.width = 720; c.height = 1080;
    var g = c.getContext('2d');
    var gr = g.createLinearGradient(0, 0, 0, 1080); gr.addColorStop(0, k1); gr.addColorStop(1, k2);
    g.fillStyle = gr; g.fillRect(0, 0, 720, 1080);
    g.globalAlpha = .14; g.fillStyle = '#fff';
    g.beginPath(); g.arc(600, 160, 220, 0, 7); g.fill();
    g.beginPath(); g.arc(80, 950, 180, 0, 7); g.fill();
    g.globalAlpha = 1; g.fillStyle = '#fff'; g.textAlign = 'center';
    g.font = '800 76px "Century Gothic",Arial,sans-serif';
    var woorden = t1.split(' '), regels = [], r = '';
    woorden.forEach(function (w) { if ((r + ' ' + w).trim().length > 12) { regels.push(r.trim()); r = w; } else r += ' ' + w; });
    regels.push(r.trim());
    regels.forEach(function (rg, i) { g.fillText(rg, 360, 430 + i * 92); });
    g.font = '400 40px "Century Gothic",Arial,sans-serif';
    g.fillText(t2, 360, 460 + regels.length * 92);
    g.font = '800 26px "Century Gothic",Arial,sans-serif'; g.globalAlpha = .8;
    g.fillText('G L O B A L · B U I T E N R E C L A M E', 360, 1010);
    try { return c.toDataURL('image/jpeg', 0.82); } catch (e) { return null; }
  }
  function zaaiDemo() {
    var nu = Date.now(), D = 86400000;
    var defs = [
      { t1: 'Zomeractie −20%', t2: 'Alleen dit weekend', k1: '#F59E0B', k2: '#EF4444', naam: 'zomeractie-korting.jpg', dagen: 2, shared: [{ email: 'anna@mediabureau.nl', d: 2 }, { email: 'mark@klant.nl', d: 1 }] },
      { t1: 'Festival Friday', t2: 'Line-up nu bekend', k1: '#7C3AED', k2: '#EC4899', naam: 'festival-friday.jpg', dagen: 5, shared: [{ email: 'eva@festival.nl', d: 4 }] },
      { t1: 'Nieuwe smaak!', t2: 'Proef ’m vandaag nog', k1: '#10B981', k2: '#065F46', naam: 'nieuwe-smaak.jpg', dagen: 9, shared: [] },
      { t1: 'Sale t/m zondag', t2: 'Tot 50% korting', k1: '#195AA6', k2: '#5BC4E8', naam: 'sale-zondag.jpg', dagen: 14, shared: [{ email: 'sanne@retailer.nl', d: 12 }] },
      { t1: 'Grand opening', t2: 'Zaterdag 10.00 uur', k1: '#0F172A', k2: '#475569', naam: 'grand-opening.jpg', dagen: 21, shared: [] },
      { t1: 'Kerstshow 2026', t2: 'Tickets nu online', k1: '#B91C1C', k2: '#7F1D1D', naam: 'kerstshow-2026.jpg', dagen: 30, shared: [{ email: 'pieter@theater.nl', d: 28 }] }
    ];
    defs.forEach(function (d, i) {
      var src = maakBeeld(d.t1, d.t2, d.k1, d.k2);
      if (!src) return;
      db.uploads.push({
        id: 'demo' + (i + 1), sig: 'demo:' + (i + 1), demo: true, name: d.naam, src: src,
        date: new Date(nu - d.dagen * D).toISOString(),
        shared: d.shared.map(function (s) { return { email: s.email, date: new Date(nu - s.d * D).toISOString() }; })
      });
    });
    db.seeded = true; save();
  }
  function zaaiAanvragen() {
    var nu = Date.now(), D = 86400000;
    db.requests = db.requests || [];
    db.requests.push(
      { id: 'demoR1', demo: true, type: 'advies', uiting: 'festival-friday.jpg', msg: 'Is het lettertype op leesafstand groot genoeg voor de snelwegmast?', naam: '', email: '', bedrijf: '', date: new Date(nu - 6 * D).toISOString(), status: 'Beantwoord' },
      { id: 'demoR2', demo: true, type: 'campagne', uiting: 'zomeractie-korting.jpg', msg: 'Graag inboeken voor week 34-35, regio Randstad, indicatie €25k.', naam: '', email: '', bedrijf: '', date: new Date(nu - 1 * D).toISOString(), status: 'In behandeling' }
    );
    db.seeded2 = true; save();

              toast('Upload verwijderd'); render('uploads');
            }
          }
        });
      });
    });

  /* ---------- vergelijken (AC-01: in objectcontext) ---------- */
  /* Vereenvoudigde kopie van de objectscènes uit de viewer: fotografie +
     frame + uiting. Beide zijden tonen hetzélfde object; bij objecten met
     twee schermen staat binnen één zijde altijd dezelfde uiting op beide. */
  var CMP_FRAMES = {
    abri: { src: '../assets/format-abri.png', r: 154 / 274, box: { l: 4.6, t: 2.2, w: 90.8, h: 88.2 } },
    scrP: { src: '../assets/format-screen-portrait.png', r: 207 / 335, box: { l: 8.2, t: 5.8, w: 83.6, h: 86.4 } },

  };
  var CMP_OBJECTEN = [
    { id: 'vanwou', naam: 'Amsterdam, Van Woustraat', type: 'Abri', r: 2 / 3, fmtNaam: '2:3 staand', foto: '../assets/slide-section-bg.jpg', fx: 78, fy: 38, zoom: 1.55, dim: .12, frames: [{ f: 'abri', l: 37, t: 16, h: 66, tf: 'perspective(1100px) rotateY(-5deg)' }] },

    { id: 'westfield', naam: 'Leidschendam, Westfield Mall', type: 'Digitaal scherm', r: 9 / 16, fmtNaam: '9:16 staand', foto: '../assets/photo-winkelcentrum.jpg', fx: 52, fy: 36, zoom: 1.9, dim: .18, frames: [{ f: 'scrP', l: 37, t: 15, h: 64, tf: 'perspective(1000px) rotateY(6deg)' }] },
    { id: 'schiphol', naam: 'Schiphol Plaza, aankomsthal (2 schermen)', type: 'Stationsscherm', r: 9 / 16, fmtNaam: '9:16 staand', foto: '../assets/photo-netwerk.jpg', fx: 50, fy: 40, zoom: 1.4, dim: .30, frames: [{ f: 'scrP', l: 22.5, t: 22, h: 56, tf: 'perspective(1200px) rotateY(4deg)' }, { f: 'scrP', l: 51.5, t: 22, h: 56, tf: 'perspective(1200px) rotateY(-4deg)' }] },
    { id: 'a2', naam: 'A2 Amsterdam, knooppunt Amstel', type: 'Snelwegmast', r: 16 / 9, fmtNaam: '16:9 liggend', foto: '../assets/slide-section-bg.jpg', fx: 52, fy: 11, zoom: 2.1, dim: .05, frames: [{ f: 'mast', l: 28, t: 7, h: 88, tf: 'perspective(1600px) rotateY(-4deg)' }] }
  ];
  var cmpObj = null;
  var cmpDims = {}; // upload-id -> beeldverhouding (asynchroon gemeten)
  function meetUpload(u) {
    if (cmpDims[u.id] !== undefined) return;
    cmpDims[u.id] = null;
    var img = new Image();
    img.onload = function () {
      cmpDims[u.id] = img.naturalWidth / img.naturalHeight;
      if (actief === 'vergelijk') render('vergelijk');
    };
    img.onerror = function () { cmpDims[u.id] = 0; };
    img.src = u.src;
  }
  function pastOpObject(u, obj) {
    var ar = cmpDims[u.id];
    if (!ar) return false;
    return Math.abs(ar - obj.r) / obj.r <= 0.08;
  }
  function cmpSceneHTML(obj, uploadSrc) {
    var html = '<div class="cmp-scene">' +
      '<div class="foto" style="background-image:url(\'' + obj.foto + '\');background-position:' + obj.fx + '% ' + obj.fy + '%;transform:scale(' + obj.zoom + ');transform-origin:' + obj.fx + '% ' + obj.fy + '%"></div>' +
      (obj.dim ? '<div class="dim" style="background:rgba(10,16,24,' + obj.dim + ')"></div>' : '');
    obj.frames.forEach(function (fr) {
      var F = CMP_FRAMES[fr.f];
      var w = fr.h * F.r * 0.75;
      html += '<div class="frame" style="left:' + fr.l + '%;top:' + fr.t + '%;width:' + w + '%;height:' + fr.h + '%;transform:' + fr.tf + '">' +
        '<img class="kader" src="' + F.src + '" alt="">' +
        '<div class="vlak" style="left:' + F.box.l + '%;top:' + F.box.t + '%;width:' + F.box.w + '%;height:' + F.box.h + '%">' +
          '<img src="' + uploadSrc + '" alt=""><div class="gloss"></div>' +
        '</div>' +
      '</div>';
    });
    html += '<div class="chip">Gegenereerd met Global AI</div></div>';
    return html;
  }
  function renderVergelijk() {
    var m = document.getElementById('inhoud');
    if (db.uploads.length < 2) {
      m.innerHTML = kop('Vergelijken', 'Zet twee uitingen naast elkaar op hetzelfde object om te zien welke het sterkst werkt.') +
        '<div class="paneel"><div class="leeg"><div class="em">🆚</div><h3>Nog te weinig uploads</h3><p>Je hebt minimaal twee uploads nodig om te vergelijken. Upload een uiting in de viewer en kom hier terug.</p><a class="hoofdknop" href="../">Naar de viewer</a></div></div>';
      return;
    }
    db.uploads.forEach(meetUpload);
    if (!cmpA || !db.uploads.some(function (u) { return u.id === cmpA; })) cmpA = db.uploads[0].id;
    if (!cmpB || cmpB === cmpA || !db.uploads.some(function (u) { return u.id === cmpB; })) {
      cmpB = (db.uploads.filter(function (u) { return u.id !== cmpA; })[0] || {}).id;
    }
    function optie(sel) { return db.uploads.map(function (u) { return '<option value="' + u.id + '"' + (u.id === sel ? ' selected' : '') + '>' + esc(u.name) + '</option>'; }).join(''); }
    var A = db.uploads.filter(function (u) { return u.id === cmpA; })[0];
    var B = db.uploads.filter(function (u) { return u.id === cmpB; })[0];
    var meten = cmpDims[A.id] === null || cmpDims[B.id] === null;
    /* Alleen objecten waar béide uitingen op passen zijn selecteerbaar. */
    var passend = CMP_OBJECTEN.filter(function (o) { return pastOpObject(A, o) && pastOpObject(B, o); });
    if (!cmpObj || !passend.some(function (o) { return o.id === cmpObj; })) cmpObj = (passend[0] || {}).id || null;
    var obj = CMP_OBJECTEN.filter(function (o) { return o.id === cmpObj; })[0] || null;
    var objOpties = CMP_OBJECTEN.map(function (o) {
      var kan = passend.some(function (x) { return x.id === o.id; });
      return '<option value="' + o.id + '"' + (o.id === cmpObj ? ' selected' : '') + (kan ? '' : ' disabled') + '>' + esc(o.naam) + ' · ' + o.type + (kan ? '' : ' — past niet bij beide uitingen (' + o.fmtNaam + ')') + '</option>';
    }).join('');
    m.innerHTML = kop('Vergelijken', 'Kies twee uitingen en een object — je ziet beide direct naast elkaar in de daadwerkelijke omgeving, met dezelfde previewweergave als in de viewer.') +
      '<div class="kiesrij">' +
        '<div class="veld"><label for="cmp-a">Uiting A (links)</label><select id="cmp-a">' + optie(cmpA) + '</select></div>' +
        '<div class="veld"><label for="cmp-b">Uiting B (rechts)</label><select id="cmp-b">' + optie(cmpB) + '</select></div>' +
        '<div class="veld"><label for="cmp-obj">Object</label><select id="cmp-obj">' + objOpties + '</select></div>' +
      '</div>' +
      (meten
        ? '<div class="paneel"><div class="leeg"><div class="em">📐</div><h3>Even meten…</h3><p>We controleren welke objecten bij je uitingen passen.</p></div></div>'
        : (obj
          ? '<div class="cmp-vlak">' +
              '<div><span class="ab">A</span>' + cmpSceneHTML(obj, A.src) + '<div class="cap">' + esc(A.name) + '</div></div>' +
              '<div><span class="ab">B</span>' + cmpSceneHTML(obj, B.src) + '<div class="cap">' + esc(B.name) + '</div></div>' +
            '</div>' +
            '<p style="font-size:12.5px;color:#8b93a3;margin-top:10px">Wissel van object om beide uitingen daar te zien; je keuze van uitingen blijft staan.' + (obj.frames.length > 1 ? ' Dit object heeft twee schermen: binnen één zijde zie je dezelfde uiting op beide schermen.' : '') + '</p>'
          : '<div class="paneel"><div class="leeg"><div class="em">📐</div><h3>Geen gezamenlijk object</h3><p>Deze twee uitingen hebben verschillende formaten, waardoor er geen object is waar ze allebei op passen. Kies twee uitingen met hetzelfde formaat.</p></div></div>'));
    document.getElementById('cmp-a').addEventListener('change', function (e) { cmpA = e.target.value; if (cmpB === cmpA) cmpB = null; render('vergelijk'); });
    document.getElementById('cmp-b').addEventListener('change', function (e) { cmpB = e.target.value; if (cmpA === cmpB) cmpA = null; render('vergelijk'); });
    var so = document.getElementById('cmp-obj');
    if (so) so.addEventListener('change', function (e) { cmpObj = e.target.value; render('vergelijk'); });
  }

  /* ---------- gedeeld met ---------- */
  function renderGedeeld() {
    var m = document.getElementById('inhoud');
    var rijen = [];
    db.uploads.forEach(function (u) { u.shared.forEach(function (s) { rijen.push({ email: s.email, naam: u.name, date: s.date }); }); });
    rijen.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    m.innerHTML = kop('Gedeeld met', 'Vul een e-mailadres in en wij sturen je uiting voor je door. Hieronder zie je precies met wie je wat hebt gedeeld.') +
      '<div class="paneel">' +
      (db.uploads.length
        ? '<div class="deelrij">' +
            '<div class="veld"><label for="g-upload">Uiting</label><select id="g-upload">' + db.uploads.map(function (u) { return '<option value="' + u.id + '">' + esc(u.name) + '</option>'; }).join('') + '</select></div>' +
            '<div class="veld"><label for="g-email">E-mailadres van je contact</label><input id="g-email" type="email" placeholder="naam@bedrijf.nl"></div>' +
            '<button class="hoofdknop" id="g-doe">Verstuur voor mij</button>' +
          '</div><p class="fout" id="g-fout" style="margin:-8px 0 14px">Vul een geldig e-mailadres in.</p>'
        : '') +
      (rijen.length
        ? '<table><thead><tr><th>Gedeeld met</th><th>Uiting</th><th>Status</th></tr></thead><tbody>' +
          rijen.map(function (r) { return '<tr><td>' + esc(r.email) + '</td><td>' + esc(r.naam) + '</td><td><span class="tag">Verzonden · ' + datumNL(r.date) + '</span></td></tr>'; }).join('') +
          '</tbody></table>'
        : '<div class="leeg"><div class="em">📤</div><h3>Nog niets gedeeld</h3><p>Deel je uiting met collega’s of je klant — wij versturen ’m en jij houdt hier het overzicht.</p></div>') +
      '</div>';
    var doe = document.getElementById('g-doe');
    if (doe) doe.addEventListener('click', function () {
      var em = document.getElementById('g-email').value.trim();
      var id = document.getElementById('g-upload').value;
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) { document.getElementById('g-fout').style.display = 'block'; return; }
      var u = db.uploads.filter(function (x) { return x.id === id; })[0]; if (!u) return;
      u.shared.push({ email: em, date: new Date().toISOString() }); save();
      toast('Verzonden naar ' + em); renderGedeeld();
      var sel = document.getElementById('g-upload'); if (sel) sel.value = id;
    });
  }

  /* ---------- profiel ---------- */
  function renderProfiel() {
    var m = document.getElementById('inhoud');
    var u = db.user;
    m.innerHTML = kop('Profiel &amp; instellingen', 'Deze gegevens gebruiken we om formulieren voor te vullen en (gesimuleerde) exports en gedeelde uitingen naar je te mailen.') +
      '<div class="paneel"><div class="veldrij">' +
      veld('naam', 'Naam', 'text', u.naam) + veld('email', 'Zakelijk e-mailadres', 'email', u.email) +
      veld('bedrijf', 'Bedrijf', 'text', u.bedrijf) + veld('functie', 'Functie', 'text', u.functie) +
      '<div class="breed">' + veld('ww', 'Wachtwoord', 'password', u.ww) + '</div>' +
      '</div><button class="hoofdknop" id="p-doe" style="margin-top:18px">Wijzigingen opslaan</button></div>';
    document.getElementById('p-doe').addEventListener('click', function () {
      var v = function (id) { return document.getElementById('v-' + id).value.trim(); };
      u.naam = v('naam') || u.naam; u.email = v('email') || u.email;
      u.bedrijf = v('bedrijf'); u.functie = v('functie'); u.ww = v('ww') || u.ww;
      save(); toast('Profiel opgeslagen'); render('profiel');
    });
  }

  /* ---------- deel de tool ---------- */
  function renderDeel() {
    var m = document.getElementById('inhoud');
    var url = viewerUrl + 'start/';
    var mailto = 'mailto:?subject=' + encodeURIComponent('Bekijk je campagne alvast op de buitenreclame van Global') +
      '&body=' + encodeURIComponent('Hoi,\n\nMet AdViewer 2.0 van Global zie je in een paar seconden hoe jouw uiting eruitziet op echte buitenreclame-objecten. Deze pagina legt kort uit hoe het werkt:\n\n' + url + '\n\nGroet,\n' + db.user.naam);
    m.innerHTML = kop('Deel de tool', 'Enthousiast? Zo laat je een collega of klant kennismaken met AdViewer 2.0.') +
      '<div class="paneel"><b style="color:var(--nacht);font-size:15.5px">Wat gebeurt er als je deelt?</b>' +
      '<div style="margin:10px 0 18px">' +
        '<div class="stap"><span class="n">1</span><span><b>Je deelt een introductiepagina, niet zomaar de tool</b><p>Je collega landt op een korte uitlegpagina: wat AdViewer is, wat je ermee kunt en een mini-tutorial van vier stappen.</p></span></div>' +
        '<div class="stap"><span class="n">2</span><span><b>Daarna start je collega zelf de tool</b><p>Vanuit de uitlegpagina opent hij of zij de viewer en kan direct een eigen uiting uploaden.</p></span></div>' +
        '<div class="stap"><span class="n">3</span><span><b>Jouw uploads blijven privé</b><p>Je collega ziet alleen de tool zelf — niet jouw uploads of accountgegevens.</p></span></div>' +
      '</div>' +
      '<b style="color:var(--nacht);font-size:14px">De link die je deelt</b>' +
      '<div class="linkvak"><input id="deel-url" readonly value="' + esc(url) + '"><button class="hoofdknop" id="deel-kopieer">Kopieer link</button>' +
      '<a class="hoofdknop" style="background:#fff;color:var(--blauw);border:2px solid var(--blauw)" href="' + mailto + '">Verstuur via e-mail</a></div>' +
      '<p style="font-size:13px"><a href="' + esc(url) + '" target="_blank" rel="noopener">Bekijk zelf eerst de introductiepagina →</a></p>' +
      '</div>';
    document.getElementById('deel-kopieer').addEventListener('click', function () {
      document.getElementById('deel-url').select();
      kopieer(url, 'Link gekopieerd — plak ’m in je mail of chat');
    });
  }

  document.addEventListener('click', function (e) {
    if (!e.target.closest('.meer')) document.querySelectorAll('.meer.open').forEach(function (x) { x.classList.remove('open'); });
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') document.querySelectorAll('.meer.open').forEach(function (x) { x.classList.remove('open'); });
  });

  /* ---------- start ---------- */
  function start() {
    if (!db.seeded) zaaiDemo();
    if (!db.seeded2) zaaiAanvragen();
    var h = (location.hash || '').replace('#', '');
    render(['overzicht', 'uploads', 'vergelijk', 'gedeeld', 'aanvragen', 'profiel', 'deel'].indexOf(h) >= 0 ? h : 'overzicht');
  }
  if (db.user && db.loggedIn) start();
  else renderAuth('registreer');
})();
</script>

<script>
  window.onUsersnapLoad = function (api) {
    /* Naam uit de feedback-pop-up (of het gesimuleerde AdViewer-account) en
       het account-e-mailadres meesturen; er gaat verder niets mee
       (AVG-dataminimalisatie). */
    function usOpties() {
      var o = {};
      try {
        var naam = (localStorage.getItem("feedbackNaam") || "").trim();
        var acc = null;
        try { acc = JSON.parse(localStorage.getItem("adviewer2_account_v1")); } catch (e2) {}
        var accUser = acc && acc.loggedIn && acc.user ? acc.user : null;
        if (!naam && accUser && accUser.naam) naam = accUser.naam;
        if (naam) o.custom = { name: naam };
        if (accUser && accUser.email) o.user = { userId: accUser.email, email: accUser.email };
      } catch (e) {}
      return o;
    }
    api.init(usOpties());
    /* Vangnet: zet de gegevens ook op het moment dat de widget opent. */
    api.on("open", function (event) {
      try {
        var extra = usOpties();
        if (extra.custom) event.api.setValue("custom", extra.custom);
        if (extra.user) event.api.setValue("visitor", extra.user.email);
      } catch (e) {}
    });
    /* De feedback-pop-up roept dit aan zodra de naam is opgeslagen, zodat
       die zonder herladen meegaat: widget herstarten met de nieuwe data. */
    window.usersnapVernieuwGegevens = function () {
      var herstart = function () { try { api.init(usOpties()); } catch (e) {} };
      var p = null;
      try { p = api.destroy(); } catch (e) {}
      if (p && typeof p.then === "function") p.then(herstart, herstart); else herstart();
    };
  };
  var usersnapScript = document.createElement("script");
  usersnapScript.defer = 1;
  usersnapScript.src =
    "https://widget.usersnap.com/global/load/c4f048c1-ba97-4344-8bc6-a7afcbec2233?onload=onUsersnapLoad";
  document.getElementsByTagName("head")[0].appendChild(usersnapScript);
</script>
