<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:8px">
  <button onClick="{{ onToggle }}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 12px;background:#fff;border:1px solid #d6dbe3;border-radius:8px;cursor:pointer;font-family:inherit;font-size:12.5px;font-weight:600;color:#2b3440;text-align:left" style-hover="border-color:#9fb6d4">
    <span>{{ label }}</span>
    <span style="display:flex;align-items:center;gap:8px">
      <sc-if value="{{ hasCount }}" hint-placeholder-val="{{ false }}"><span style="min-width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;border-radius:10px;background:#195AA6;color:#fff;font-size:11px;font-weight:700">{{ count }}</span></sc-if>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5a6472" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex:none;transition:transform .15s;transform:rotate({{ rot }}deg)"><path d="M6 9l6 6 6-6"></path></svg>
    </span>
  </button>
  <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
    <div style="border:1px solid #d6dbe3;border-radius:8px;background:#fff;overflow:hidden">
      <div style="padding:8px;border-bottom:1px solid #e8ebf0">
        <input value="{{ search }}" onChange="{{ onSearch }}" placeholder="Zoeken…" style="width:100%;box-sizing:border-box;padding:7px 10px;border:1px solid #d6dbe3;border-radius:6px;font-family:inherit;font-size:12px;color:#2b3440;outline:none">
      </div>
      <div style="display:flex;gap:14px;padding:7px 12px;border-bottom:1px solid #e8ebf0;background:#f7f8fa">
        <button onClick="{{ onSelectAll }}" style="background:none;border:none;padding:0;cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:600;color:#0B78BE" style-hover="text-decoration:underline">Selecteer alles</button>
        <button onClick="{{ onClear }}" style="background:none;border:none;padding:0;cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:600;color:#5a6472" style-hover="text-decoration:underline">Wis</button>
      </div>
      <div style="max-height:216px;overflow-y:auto;padding:4px 0">
        <sc-for list="{{ options }}" as="opt" hint-placeholder-count="4">
          <label style="display:flex;align-items:center;gap:9px;padding:6px 12px;cursor:pointer;font-size:12px;color:#2b3440" style-hover="background:#f2f6fb">
            <input type="checkbox" checked="{{ opt.checked }}" onChange="{{ opt.onToggle }}" style="accent-color:#195AA6;width:14px;height:14px;margin:0;flex:none">
            <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ opt.label }}</span>
            <span style="font-size:11px;color:#8a93a0;flex:none">{{ opt.count }}</span>
          </label>
        </sc-for>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="padding:10px 12px;font-size:11.5px;color:#8a93a0">Geen resultaten</div></sc-if>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ hasChips }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-wrap:wrap;gap:6px">
      <sc-for list="{{ chips }}" as="chip" hint-placeholder-count="2">
        <span style="display:inline-flex;align-items:center;gap:5px;padding:4px 6px 4px 10px;background:#eaf1f9;border:1px solid #cddcee;border-radius:999px;font-size:11.5px;font-weight:600;color:#1B4B89">{{ chip.label }}<button onClick="{{ chip.onRemove }}" title="Verwijderen" style="width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;border:none;border-radius:50%;background:transparent;color:#1B4B89;cursor:pointer;font-size:13px;line-height:1;padding:0" style-hover="background:#d5e3f3">×</button></span>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:420}}"></script>
</body>
</html>
